version: "3.8"

services:
  db:
    image: postgres:15
    container_name: teamflow_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: teamflow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - teamflow_network

volumes:
  db_data:

networks:
  teamflow_network:
    driver: bridge
